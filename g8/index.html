/* LevCards — LevCatom closed palette on cream. SKF fonts cover Hebrew only (unicode-range); Latin, Cyrillic, Arabic fall to Rubik. */
:root{
  --coral:#E76F51;--sand:#F4A261;--gold:#E9C46A;--teal:#2A9D8F;--navy:#264653;--brown:#5A2A0C;--beige:#E6D3B9;--cream:#FBF5ED;
  --bg:var(--cream);--fg:var(--navy);--soft:#5A2A0C;--card:#fffaf3;--line:rgba(38,70,83,.16);--line2:rgba(38,70,83,.3);
  --ok:var(--teal);--bad:var(--coral);--shadow:0 2px 0 rgba(38,70,83,.12);
  --display:'SKFPogo','Rubik',system-ui,sans-serif;--body:'SKFMush','Rubik',system-ui,'Segoe UI',sans-serif;--plain:'Rubik',system-ui,'Segoe UI',Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b333c;--fg:#FBF5ED;--soft:#E6D3B9;--card:#264653;--line:rgba(251,245,237,.16);--line2:rgba(251,245,237,.32);--shadow:0 2px 0 rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b333c;--fg:#FBF5ED;--soft:#E6D3B9;--card:#264653;--line:rgba(251,245,237,.16);--line2:rgba(251,245,237,.32);--shadow:0 2px 0 rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.5;min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
#app{max-width:880px;margin:0 auto;padding:0 16px 64px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--plain);font-weight:700;font-size:20px;text-decoration:none;letter-spacing:.2px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--coral);box-shadow:6px 6px 0 -1px var(--gold)}
.topr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-family:var(--plain);font-size:15px;background:var(--beige);color:var(--navy);border-radius:999px;padding:3px 12px;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langsel{background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:4px 10px;font-family:var(--plain);font-size:15px}
.link{background:none;border:0;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px;color:var(--soft)}
.offline{background:var(--gold);color:var(--navy);border-radius:12px;padding:10px 14px;font-size:16px;margin-bottom:12px}
.page{display:grid;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.12;margin:6px 0 0}
h2{font-family:var(--display);font-weight:400}
.muted{color:var(--soft)}

/* buttons */
.btn{appearance:none;border:2px solid var(--navy);background:var(--card);color:var(--fg);border-radius:999px;padding:10px 20px;cursor:pointer;font-size:18px;min-height:48px;box-shadow:var(--shadow);transition:transform .12s ease}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--navy);color:var(--cream)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{border-color:var(--cream)}:root:not([data-theme="light"]) .btn.primary{background:var(--cream);color:var(--navy)}}
.btn.big{font-size:20px;padding:12px 26px;min-height:56px}
.btn.ghost{border-color:var(--line2);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.say{appearance:none;border:0;background:transparent;font-size:20px;cursor:pointer;padding:6px;border-radius:10px;line-height:1}
.say:hover{background:var(--line)}

/* language + login */
.hero{display:grid;gap:18px;padding-top:24px;text-align:center;justify-items:center}
.lead{font-size:18px;color:var(--soft);margin:0}
.langgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:560px}
.langbtn{appearance:none;border:2px solid var(--navy);background:var(--card);border-radius:var(--r);padding:22px 12px;cursor:pointer;display:grid;gap:4px;min-height:110px;align-content:center;box-shadow:var(--shadow)}
.langbtn b{font-family:var(--plain);font-size:26px;font-weight:600}
.langbtn small{font-family:var(--plain);font-size:15px;color:var(--soft)}
.langbtn:nth-child(1){background:var(--coral);color:var(--cream)}
.langbtn:nth-child(2){background:var(--teal);color:var(--cream)}
.langbtn:nth-child(3){background:var(--gold);color:var(--navy)}
.langbtn:nth-child(4){background:var(--sand);color:var(--navy)}
.langbtn:nth-child(4) small{color:var(--brown)}
.login{display:grid;gap:14px;width:100%;max-width:420px;text-align:start}
.login label{display:grid;gap:6px;font-size:17px}
.login input{border:2px solid var(--line2);background:var(--card);border-radius:14px;padding:12px 14px;font-size:20px;font-family:var(--plain);min-height:52px}
.login input:focus{border-color:var(--teal);outline:none}
.err{color:var(--coral);margin:0;font-size:16px}
.note{font-size:15px;color:var(--soft);margin:0}

/* home */
.homehead .sub{margin:4px 0 0;font-size:22px;color:var(--soft)}
.setlist{display:grid;gap:12px}
.setcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;box-shadow:var(--shadow);animation:rise .35s ease both;animation-delay:calc(var(--i,0)*50ms)}
.setcard:hover{border-color:var(--line2)}
.setinfo{display:grid;flex:1;min-width:0}
.setinfo b{font-family:var(--plain);font-weight:600;font-size:19px;overflow-wrap:anywhere}
.setinfo small{color:var(--soft);font-size:15px}
.chev{font-size:30px;color:var(--soft);line-height:1}
[dir="rtl"] .chev{transform:scaleX(-1)}
.ringwrap{flex:none;width:46px;height:46px}
.ring{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring-bg{stroke:var(--beige)}
.ring-fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* set page */
.back{justify-self:start;text-decoration:none;font-size:16px;color:var(--soft);padding:4px 0}
.back::before{content:'‹ ';}
[dir="rtl"] .back::before{content:'› ';}
.sethead h1{overflow-wrap:anywhere}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lvpill{font-family:var(--plain);font-size:14px;border-radius:999px;padding:2px 12px}
.lvpill.lv0,.lv.lv0{background:var(--beige);color:var(--navy)}
.lvpill.lv1,.lv.lv1{background:var(--gold);color:var(--navy)}
.lvpill.lv2,.lv.lv2{background:var(--teal);color:var(--cream)}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:16px}
.seg button{appearance:none;border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sec{font-size:24px;margin:8px 0 -6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:grid;gap:4px;align-content:start;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;box-shadow:var(--shadow);min-height:118px;transition:transform .15s ease,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--line2)}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-family:var(--plain);background:var(--beige);color:var(--navy)}

(function () {

  const NS = 'lc.' + (CFG.course && CFG.course !== 'g7' ? CFG.course + '.' : '');

    get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

  LC.t = (k, vars) => {

  LC.sample = (a, n) => LC.shuffle(a).slice(0, n);
  LC.fmtTime = (ms) => { const s = ms / 1000; return s < 60 ? s.toFixed(1) + '' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };

  /* ---------- DOM helper: h('button.btn.primary', {onclick}, 'text', child) ---------- */
  LC.h = function (sel, attrs, ...kids) {
    const m = sel.split(/(?=[.#])/);

    if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
    if (attrs) for (const k in attrs) {

      if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'class') String(v).split(/\s+/).filter(Boolean).forEach((c) => e.classList.add(c));
      else if (k === 'text') e.textContent = v;
      else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) e.style.setProperty(sk, v[sk]); else e.style[sk] = v[sk]; } }
      else if (k in e && typeof v !== 'string') e[k] = v;

    kids.forEach(add);

  /* ---------- cards ---------- */
  LC.term = (c) => c.term;

  // Strip niqqud / tashkeel / punctuation so typing is checked on letters only.
  LC.norm = (s) => String(s || '').normalize('NFKC').toLowerCase()
    .replace(/[֑-ׇً-ٰٟـ]/g, '')
    .replace(/[’‘`´]/g, "'")
    .replace(/[.,!?;:"“”„()[\]{}…\-–—_/\\|]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
  // Accepted forms: the whole answer, each "/" alternative, each one without a (bracketed note).
  LC.accepts = (answer) => {
    const out = new Set();
    const base = String(answer || '');
    const variants = [base, base.replace(/\([^)]*\)/g, '')];
    variants.forEach((v) => { out.add(LC.norm(v)); v.split(/\s*\/\s*|\s*,\s*|\s*;\s*/).forEach((p) => p.trim() && out.add(LC.norm(p.replace(/\([^)]*\)/g, '')))); });
    out.delete('');
    return out;
  };
  LC.isRight = (input, answer) => { const n = LC.norm(input); return !!n && LC.accepts(answer).has(n); };
  LC.near = (input, answer) => { // one letter off: say "almost", still counted wrong
    const a = LC.norm(input); if (!a) return false;
    for (const b of LC.accepts(answer)) if (lev(a, b) === 1 && b.length >= 3) return true;
    return false;
  };
  // Fill-in-the-blank sentences for a card: its own `gaps` (written with ___ and a hint),
  // else its example sentence with the word blanked out.
  LC.gapsOf = (c) => {
    if (Array.isArray(c.gaps) && c.gaps.length) return c.gaps;
    if (!c.ex) return [];
    for (const a of String(c.term).replace(/\([^)]*\)/g, '').split('/').map((x) => x.trim()).filter(Boolean)) {
      const re = new RegExp('(^|[^A-Za-z])' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![A-Za-z])', 'i');

    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

  let queue = store.get('q', []);

      get: (id) => map[id] || 0,

      counts(cards) { const c = [0, 0, 0]; cards.forEach((k) => c[map[k.id] || 0]++); return c; },

      h('div.seg',
        h('button', { type: 'button', 'aria-pressed': String(focus === 'all'), onclick: () => { store.set('focus.' + set.id, 'all'); setScreen(set); } }, LC.t('focusAll', { n: set.cards.length })),
        h('button', { type: 'button', 'aria-pressed': String(focus === 'weak'), disabled: !weak.length, onclick: () => { store.set('focus.' + set.id, 'weak'); setScreen(set); } }, LC.t('focusWeak', { n: weak.length }))),
      !weak.length ? h('p.allknown', LC.t('allKnown')) : null);
    frame(
      h('a.back', { href: '#/' }, LC.t('back')),
      h('section.sethead', h('h1', LC.setTitle(set)),
        h('div.levels', [0, 1, 2].map((i) => h('span.lvpill.lv' + i, LC.t('lv' + i) + ' ' + cnt[i]))),
        LC.ui.progress(cnt[2], set.cards.length)),
      focusSel, awSel,
      h('h2.sec', LC.t('practice')), h('div.tiles', ORDER.study.map(tile)),
      h('h2.sec', LC.t('games')), h('div.tiles', ORDER.game.map(tile)),
      weak.length ? [h('h2.sec', LC.t('stillLearning') + ' (' + weak.length + ')'), h('ul.cardlist', weakSorted.map(row))] : null,
      known.length ? [h('h2.sec', LC.t('knownWords') + ' (' + known.length + ')'), h('ul.cardlist.known', known.map(row))] : null);
  }

  /* ---------- mode host ---------- */
  let cleanup = [];
  function teardown() { cleanup.forEach((f) => { try { f(); } catch (e) { /* ignore */ } }); cleanup = []; if (LC.canSpeak) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }

  function modeScreen(set, name) {
    const mod = LC.modes[name];
    if (!mod) { location.hash = '#/set/' + set.id; return; }
    const started = Date.now();
    LC.cur = { set, mode: name, where: null };
    LC.log('start', {}, { set: set.id, mode: name });
    const root = h('div.mode.mode-' + name);
    frame(h('div.modebar', h('a.back', { href: '#/set/' + set.id }, LC.t('back')), h('span.modename', LC.t('m_' + name)), h('span.modeset', LC.setTitle(set))), root);
    const aw = LC.answerWith(set.id);
    const termLang = set.term_lang || 'en';
    const ctx = {
      // the cards to practise (whole set, or only the ones not known yet); distractors still come from the whole set
      set, cards: LC.practiceCards(set).slice(), lang: LC.lang, termLang, h, t: LC.t, root,
      term: LC.term, def: LC.def,
      answerWith: aw,
      // what the learner sees, and what they must produce
      prompt: (c) => (aw === 'term' ? LC.def(c) : c.term),
      answer: (c) => (aw === 'term' ? c.term : LC.def(c)),
      promptIsTerm: aw !== 'term',
      speakTerm: (c) => LC.speak(c.term, termLang),
      speak: LC.speak, canSpeak: LC.canSpeak,
      isRight: (input, c) => LC.isRight(input, aw === 'term' ? c.term : LC.def(c)),
      near: (input, c) => LC.near(input, aw === 'term' ? c.term : LC.def(c)),
      shuffle: LC.shuffle, sample: LC.sample, pick: LC.pick,
      // n options for c, unique by text, the right one included
      options(c, n) {
        const right = ctx.answer(c);
        const seen = new Set([LC.norm(right)]); const out = [right];
        for (const o of LC.shuffle(set.cards)) { if (out.length >= n) break; const a = ctx.answer(o); const k = LC.norm(a); if (!seen.has(k)) { seen.add(k); out.push(a); } }
        return LC.shuffle(out);
      },
      // n English words as options for a fill-in-the-blank, the right one included
      termOptions(c, n) {
        const seen = new Set([LC.norm(c.term)]); const out = [c.term];
        for (const o of LC.shuffle(set.cards)) { if (out.length >= n) break; const k = LC.norm(o.term); if (!seen.has(k)) { seen.add(k); out.push(o.term); } }
        return LC.shuffle(out);
      },
      gaps: LC.gapsOf,
      mastery: LC.mastery(set.id),
      log: (kind, data) => LC.log(kind, data, { set: set.id, mode: name }),
      // per-answer record for the teacher (card id, right/wrong, question type, what they typed/chose),
      // plus the learner's own record: a wrong answer is counted and a "known" card goes back to "still learning".
      // Study modes then set the level they want; games only move a new card up to "familiar".
      answered(c, ok, q, given) {
        LC.log('ans', { c: c.id, ok: !!ok, q, a: given == null ? undefined : String(given).slice(0, 60) }, { set: set.id, mode: name });
        const M = ctx.mastery;
        if (!ok) { LC.addWrong(set.id, c.id); if (M.get(c.id) > 1) M.set(c.id, 1); }
        else if (mod.kind === 'game' && M.get(c.id) === 0) M.set(c.id, 1);
      },
      where: (p) => { if (LC.cur) LC.cur.where = p; },
      finish(result) { LC.log('finish', Object.assign({ ms: Date.now() - started }, result || {}), { set: set.id, mode: name }); flush(); },
      best: {
        get: (k) => store.get('best.' + set.id + '.' + k, null),
        // returns true when v beats the stored record
        offer(k, v, lowerIsBetter) { const cur = store.get('best.' + set.id + '.' + k, null); const better = cur == null || (lowerIsBetter ? v < cur : v > cur); if (better) store.set('best.' + set.id + '.' + k, v); return better; },
      },
      on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); cleanup.push(() => target.removeEventListener(ev, fn, opt)); },
      every(fn, ms) { const id = setInterval(fn, ms); cleanup.push(() => clearInterval(id)); return id; },
      later(fn, ms) { const id = setTimeout(fn, ms); cleanup.push(() => clearTimeout(id)); return id; },
      frame(fn) { let id = 0, alive = true; const loop = (ts) => { if (!alive) return; if (fn(ts) !== false) id = requestAnimationFrame(loop); }; id = requestAnimationFrame(loop); cleanup.push(() => { alive = false; cancelAnimationFrame(id); }); },
      onCleanup(fn) { cleanup.push(fn); },
      exit() { location.hash = '#/set/' + set.id; },
      restart() { route(); },
      ui: LC.ui,
    };
    const r = mod.mount(root, ctx);
    if (typeof r === 'function') cleanup.push(r);
  }

  /* ---------- shared UI bits for modes ---------- */
  LC.ui = {
    termEl: (c, termLang, big) => h('span.term' + (big ? '.big' : ''), { lang: termLang || 'en', dir: 'auto' }, c.term),
    sayBtn: (text, lang) => (LC.canSpeak ? h('button.say', { type: 'button', 'aria-label': LC.t('listen'), onclick: (e) => { e.stopPropagation(); LC.speak(text, lang); } }, '🔊') : null),
    // big end-of-activity card: title, lines, buttons [{label, primary, onclick}]
    end({ title, lines, actions, good }) {
      return h('section.endcard' + (good ? '.good' : ''),
        h('div.burst', { 'aria-hidden': 'true' }, Array.from({ length: 10 }, (_, i) => h('i', { style: { '--k': i } }))),
        h('h2', title), (lines || []).filter(Boolean).map((l) => (l instanceof Node ? l : h('p', l))),
        h('div.row', (actions || []).map((a) => h('button.btn' + (a.primary ? '.primary' : ''), { type: 'button', onclick: a.onclick }, a.label))));
    },
    progress(done, total) { return h('div.prog', { role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': done }, h('i', { style: { width: (total ? (100 * done) / total : 0) + '%' } })); },
  };

  /* ---------- router ---------- */
  async function route() {
    teardown();
    applyLang();
    document.title = BASE_TITLE;
    if (!LC.lang) return langScreen();
    if (!LC.me) return loginScreen();
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    LC.cur = null;
    if (parts[0] === 'set' && parts[1]) {
      let set = findSet(parts[1]);
      if (!set) { try { await LC.loadSets(); } catch (e) { /* offline */ } set = findSet(parts[1]); }
      if (!set) { location.hash = '#/'; return; }
      document.title = LC.setTitle(set) + ' · ' + BASE_TITLE;
      return parts[2] ? modeScreen(set, parts[2]) : setScreen(set);
    }
    return homeScreen();
  }
  LC.route = route;
  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', () => { route(); flush(); });
})();

// ---- src/modes/00-q.js
// Shared question widgets for the study modes: multiple choice and typed answer, with feedback.
// Every widget takes an optional `gap` sentence: then it is a fill-in-the-blank and the answer is always the English word.
// onDone(ok, how) is called once the learner moves on. how: 'auto' | 'next' | 'override'.
(function () {
  const LC = window.LC;
  const h = LC.h;
  LC.q = {
    // one keyboard dispatcher per mode; each new question replaces the handler
    bindKeys(ctx) { LC.q.key = null; ctx.on(window, 'keydown', (e) => { if (LC.q.key) LC.q.key(e); }); ctx.onCleanup(() => { LC.q.key = null; }); },

    // a random fill-in-the-blank sentence for this card, or null
    gapFor(ctx, c) { const g = ctx.gaps(c); return g.length ? LC.pick(g) : null; },

    gapEl(sentence, termLang) {
      const parts = String(sentence).split(/_{2,}/);
      const out = h('div.qtext.gap', { lang: termLang || 'en', dir: 'ltr' });
      parts.forEach((p, i) => { out.append(p); if (i < parts.length - 1) out.append(h('span.blank', { 'aria-label': 'blank' })); });
      return out;
    },

    promptEl(ctx, c, label, gap) {
      if (gap) return [h('div.qlabel', h('span', label)), LC.q.gapEl(gap, ctx.termLang)];
      const isTerm = ctx.promptIsTerm;
      const text = ctx.prompt(c);
      return [
        h('div.qlabel', h('span', label)),
        h('div.qtext', isTerm ? LC.ui.termEl(c, ctx.termLang) : h('span', { dir: 'auto' }, text), isTerm ? LC.ui.sayBtn(c.term, ctx.termLang) : null),
      ];
    },

    feedback(ctx, c, ok, opts) {
      const gap = opts.gap;
      const ans = gap ? c.term : ctx.answer(c);
      const termAnswer = gap || ctx.answerWith === 'term';
      const box = h('div.fb.' + (ok ? 'ok' : 'no'), { role: 'status' });
      // for a blank, show the whole sentence with the word in place
      const filled = gap ? h('span.filled', { lang: ctx.termLang, dir: 'ltr' }, ...String(gap).split(/_{2,}/).flatMap((p, i, a) => (i < a.length - 1 ? [p, h('b', c.term.replace(/\s*\([^)]*\)/g, '').split('/')[0].trim())] : [p]))) : null;
      if (ok) {
        box.append(h('b', LC.pick(LC.t('praise'))));
        if (filled) box.append(filled);
      } else {
        box.append(h('b', opts.near ? '≈ ' + LC.t('notYet') : LC.t('notYet')), h('span.ans', { dir: 'auto' }, ans, termAnswer ? LC.ui.sayBtn(c.term, ctx.termLang) : null));
        if (filled) box.append(filled);
        else if (c.ex && ctx.answerWith === 'term') box.append(h('span', { dir: 'ltr', lang: 'en', style: { fontFamily: 'var(--plain)', fontSize: '16px', opacity: '.8' } }, c.ex));
        if (gap || ctx.answerWith === 'term') box.append(h('span', { dir: 'auto', style: { fontSize: '16px' } }, '= ' + LC.def(c)));
        if (opts.given != null && opts.given !== '') box.append(h('span', LC.t('youWrote') + ' ', h('span', { dir: 'auto', style: { textDecoration: 'line-through' } }, opts.given)));
      }
      return box;
    },

    mc(ctx, c, label, onDone, gap) {
      const pool = gap ? ctx.set.cards.map((x) => LC.norm(x.term)) : ctx.set.cards.map((x) => LC.norm(ctx.answer(x)));
      const n = Math.min(4, new Set(pool).size);
      const opts = gap ? ctx.termOptions(c, n) : ctx.options(c, n);
      const right = LC.norm(gap ? c.term : ctx.answer(c));
      const card = h('section.qcard', LC.q.promptEl(ctx, c, label, gap));
      const grid = h('div.opts');
      let picked = false;
      const choose = (btn, val) => {
        if (picked) return; picked = true;
        const ok = LC.norm(val) === right;
        [...grid.children].forEach((b) => { b.disabled = true; if (LC.norm(b.dataset.v) === right) b.classList.add('right'); });
        if (!ok) btn.classList.add('wrong');
        ctx.answered(c, ok, gap ? 'gap-mc' : 'mc', val);
        const fb = LC.q.feedback(ctx, c, ok, { gap });
        card.append(fb);
        LC.q.continueOn(ctx, card, fb, ok, onDone, false);
      };
      opts.forEach((o, i) => {
        const b = h('button.opt', { type: 'button', 'data-v': o, onclick: () => choose(b, o) }, h('span.k', String(i + 1)), h('span', gap ? { lang: ctx.termLang, dir: 'ltr' } : { dir: 'auto' }, o));
        grid.append(b);
      });
      card.append(grid);
      LC.q.key = (e) => { const k = +e.key; if (k >= 1 && k <= opts.length) { e.preventDefault(); grid.children[k - 1].click(); } };
      return card;
    },

    typed(ctx, c, label, onDone, gap) {
      const card = h('section.qcard', LC.q.promptEl(ctx, c, label, gap));
      const input = h('input', { type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, dir: gap ? 'ltr' : 'auto', lang: gap ? ctx.termLang : null, 'aria-label': LC.t('typeIt'), placeholder: LC.t('typeIt') });
      const checkBtn = h('button.btn.primary', { type: 'submit' }, LC.t('check'));
      const dk = h('button.btn.ghost', { type: 'button', onclick: () => submit(true) }, LC.t('dontKnow'));
      const form = h('form.typein', { onsubmit: (e) => { e.preventDefault(); submit(false); } }, input, checkBtn, dk);
      card.append(form);
      LC.q.key = null;
      let done = false;
      function submit(gaveUp) {
        if (done) return;
        const given = gaveUp ? '' : input.value;
        if (!gaveUp && !given.trim()) { input.focus(); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); return; }
        done = true;
        const ok = !gaveUp && (gap ? LC.isRight(given, c.term) : ctx.isRight(given, c));
        const near = !ok && !gaveUp && (gap ? LC.near(given, c.term) : ctx.near(given, c));
        input.disabled = true; checkBtn.disabled = true; dk.disabled = true;
        input.classList.add(ok ? 'right' : 'wrong');
        ctx.answered(c, ok, gap ? 'gap-write' : 'write', gaveUp ? '' : given);
        const fb = LC.q.feedback(ctx, c, ok, { given: gaveUp ? null : given, near, gap });
        card.append(fb);
        LC.q.continueOn(ctx, card, fb, ok, onDone, !ok && !gaveUp);
      }
      setTimeout(() => input.focus(), 30);
      return card;
    },

    // correct -> short pause then move on; wrong -> wait for "next" (or Enter), with optional "I was right"
    continueOn(ctx, card, fb, ok, onDone, canOverride) {
      let gone = false;
      const go = (how) => { if (gone) return; gone = true; LC.q.key = null; onDone(how === 'override' ? true : ok, how); };
      if (ok) { ctx.later(() => go('auto'), 1200); LC.q.key = (e) => { if (e.key === 'Enter') { e.preventDefault(); go('auto'); } }; return; }
      const row = h('div.row');
      if (canOverride) row.append(h('button.btn.ghost', { type: 'button', onclick: () => go('override') }, LC.t('override')));
      const nx = h('button.btn.primary', { type: 'button', onclick: () => go('next') }, LC.t('next'));
      row.append(nx); fb.append(row);
      // the Enter that submitted the answer must not also skip the feedback
      setTimeout(() => { LC.q.key = (e) => { if (e.key === 'Enter') { e.preventDefault(); go('next'); } }; nx.focus({ preventScroll: true }); }, 250);
      fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    },
  };
})();

// ---- src/modes/flash.js
// Flashcards: flip, sort into "know it" / "still learning", swipe or arrow keys.
(function () {
  const LC = window.LC;
  const h = LC.h;
  LC.modes.flash = {
    kind: 'study', min: 1,
    mount(root, ctx) {
      let deck = ctx.cards.slice();
      let i = 0, known = new Set(), still = new Set();
      const rtl = document.documentElement.dir === 'rtl';

      function face(c, side) {
        const isTerm = side === 'answer' ? ctx.answerWith === 'term' : ctx.promptIsTerm;
        const text = side === 'answer' ? ctx.answer(c) : ctx.prompt(c);
        return h('div.face.' + (side === 'answer' ? 'f-ans' : 'f-q'),
          h('div',
            h('span.content' + (isTerm ? '.term' : ''), isTerm ? { lang: ctx.termLang, dir: 'auto' } : { dir: 'auto' }, text),
            isTerm && c.ex ? h('span.ex', { lang: 'en', dir: 'ltr' }, c.ex) : null),
          isTerm ? LC.ui.sayBtn(c.term, ctx.termLang) : null,
          side !== 'answer' ? h('span.hint', LC.t('flip')) : null);
      }

      function show() {
        if (i >= deck.length) return end();
        const c = deck[i];
        ctx.where((i + 1) + '/' + deck.length);
        const flip = h('div.flip', { role: 'button', tabindex: 0, 'aria-label': LC.t('flip') }, h('div.flip-in', face(c, 'prompt'), face(c, 'answer')));
        const toggle = () => flip.classList.toggle('on');
        // tap flips; a horizontal drag sorts the card
        let x0 = null, dx = 0;
        flip.addEventListener('pointerdown', (e) => { if (e.target.closest('.say')) return; x0 = e.clientX; dx = 0; });
        flip.addEventListener('pointermove', (e) => { if (x0 == null) return; dx = e.clientX - x0; flip.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; });
        const release = () => {
          if (x0 == null) return; x0 = null; flip.style.transform = '';
          if (Math.abs(dx) > 90) { const toKnow = rtl ? dx < 0 : dx > 0; sort(toKnow); } else if (Math.abs(dx) < 8) toggle();
        };
        flip.addEventListener('pointerup', release);
        flip.addEventListener('pointercancel', () => { x0 = null; flip.style.transform = ''; });
        flip.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });

        root.replaceChildren(
          h('div.hud', h('span', h('b', (i + 1) + ' / ' + deck.length)), h('span', '✓ ' + known.size + ' · ↻ ' + still.size)),
          LC.ui.progress(i, deck.length),
          flip,
          h('div.fcbtns',
            h('button.btn.still', { type: 'button', onclick: () => sort(false) }, '↻ ' + LC.t('still')),
            h('button.btn.know', { type: 'button', onclick: () => sort(true) }, '✓ ' + LC.t('gotIt'))),
          h('div.tools',
            h('button.btn.ghost', { type: 'button', onclick: () => { deck = LC.shuffle(deck); i = 0; known.clear(); still.clear(); show(); } }, LC.t('shuffle')),
            h('button.btn.ghost', { type: 'button', onclick: () => { i = 0; known.clear(); still.clear(); show(); } }, LC.t('restart'))),
          h('p.kbdhint', '␣ ⟲  ·  ← →'));
        flip.focus({ preventScroll: true });
      }

      function sort(know) {
        const c = deck[i]; if (!c) return;
        (know ? known : still).add(c.id); (know ? still : known).delete(c.id);
        if (know) ctx.mastery.set(c.id, Math.max(ctx.mastery.get(c.id), 1));
        ctx.answered(c, know, 'flash');
        i++; show();
      }

      ctx.on(window, 'keydown', (e) => {
        if (i >= deck.length) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          const forward = e.key === 'ArrowRight';
          sort(rtl ? !forward : forward);
        } else if (e.key === ' ' && document.activeElement && !document.activeElement.classList.contains('flip')) {
          const f = root.querySelector('.flip'); if (f) { e.preventDefault(); f.classList.toggle('on'); }
        }
      });

      function end() {
        ctx.finish({ score: known.size, total: deck.length, still: [...still] });
        const left = deck.filter((c) => still.has(c.id));
        root.replaceChildren(LC.ui.end({
          title: LC.t('deckDone'), good: still.size === 0,
          lines: [h('p.big', known.size + ' / ' + deck.length), '✓ ' + LC.t('gotIt') + ': ' + known.size + '   ↻ ' + LC.t('still') + ': ' + still.size],
          actions: [
            left.length ? { label: LC.t('onlyStill', { n: left.length }), primary: true, onclick: () => { deck = left; i = 0; known.clear(); still.clear(); show(); } } : null,
            { label: LC.t('restart'), primary: !left.length, onclick: () => { deck = ctx.cards.slice(); i = 0; known.clear(); still.clear(); show(); } },
            { label: LC.t('back'), onclick: ctx.exit },
          ].filter(Boolean),
        }));
      }
      show();
    },
  };
})();

// ---- src/modes/learn.js
// Learn: short rounds (up to 7 cards). New cards get multiple choice, familiar cards get typed.
// Right: card moves up a level and leaves the round. Wrong: it drops back and comes again later in the round.
(function () {
  const LC = window.LC;
  const h = LC.h;
  const ROUND = 7;
  LC.modes.learn = {
    kind: 'study', min: 2,
    mount(root, ctx) {
      LC.q.bindKeys(ctx);
      const M = ctx.mastery;
      const total = ctx.cards.length;
      let roundNo = 0, queue = [], roundCards = [], firstTry = 0, asked = 0;
      const uniqueAnswers = new Set(ctx.cards.map((c) => LC.norm(ctx.answer(c)))).size;

      const mastered = () => ctx.cards.filter((c) => M.get(c.id) >= 2).length;

      function head() {
        const m = mastered(), cnt = M.counts(ctx.cards);
        ctx.where(m + '/' + total);
        return [
          h('div.hud', h('span', h('b', '◎ ' + m + ' / ' + total)),
            h('span', [0, 1, 2].map((l) => h('span.lvpill.lv' + l, { style: { marginInlineStart: '6px' } }, LC.t('lv' + l) + ' ' + cnt[l])))),
          LC.ui.progress(m, total),
        ];
      }

      function startRound() {
        const pool = ctx.cards.filter((c) => M.get(c.id) < 2);
        if (!pool.length) return allDone();
        roundNo++;
        // familiar cards first so the round feels winnable, then new ones; random inside each level
        roundCards = [...LC.shuffle(pool.filter((c) => M.get(c.id) === 1)), ...LC.shuffle(pool.filter((c) => M.get(c.id) === 0))].slice(0, ROUND);
        queue = LC.shuffle(roundCards);
        firstTry = 0; asked = 0;
        ask();
      }

      const triedWrong = new Set();
      function ask() {
        if (!queue.length) return roundEnd();
        const c = queue.shift();
        const lvl = M.get(c.id);
        const typed = lvl >= 1 || uniqueAnswers < 2;
        // about half the questions on a card with a sentence are fill-in-the-blank
        const gap = Math.random() < 0.5 ? LC.q.gapFor(ctx, c) : null;
        const label = gap ? LC.t(typed ? 'gapType' : 'gapChoose') : typed ? LC.t('typeIt') : LC.t('choose');
        const q = typed ? LC.q.typed(ctx, c, label, done, gap) : LC.q.mc(ctx, c, label, done, gap);
        root.replaceChildren(...head(), q);
        function done(ok) {
          asked++;
          if (ok) {
            if (!triedWrong.has(c.id)) firstTry++;
            M.set(c.id, lvl + 1);
          } else {
            triedWrong.add(c.id);
            M.set(c.id, typed ? 1 : 0);
            // comes back after a couple of other cards
            queue.splice(Math.min(2, queue.length), 0, c);
          }
          ask();
        }
      }

      function roundEnd() {
        triedWrong.clear();

// Write: type every card. Misses come back in a second pass until each one has been typed right once.
(function () {
  const LC = window.LC;
  const h = LC.h;
  LC.modes.write = {
    kind: 'study', min: 1,
    mount(root, ctx) {
      LC.q.bindKeys(ctx);
      const M = ctx.mastery;
      let deck, queue, firstRight, missed, pass;

      function begin(cards) {
        deck = LC.shuffle(cards); queue = deck.slice(); firstRight = new Set(); missed = new Set(); pass = 1;
        ask();
      }
      function ask() {
        if (!queue.length) {
          if (missed.size && pass === 1) { pass = 2; queue = LC.shuffle(deck.filter((c) => missed.has(c.id))); return ask(); }
          return end();
        }
        const c = queue.shift();
        const doneN = deck.length - queue.length - 1;
        ctx.where((doneN + 1) + '/' + deck.length + (pass > 1 ? ' (2)' : ''));
        const gap = Math.random() < 0.4 ? LC.q.gapFor(ctx, c) : null;
        const q = LC.q.typed(ctx, c, LC.t(gap ? 'gapType' : 'typeIt') + (pass > 1 ? ' · ↻' : ''), (ok) => {
          if (ok) {
            if (pass === 1 && !missed.has(c.id)) { firstRight.add(c.id); M.set(c.id, M.get(c.id) >= 1 ? 2 : 1); }
          } else {
            missed.add(c.id); M.set(c.id, Math.min(M.get(c.id), 1));
            if (pass > 1) queue.push(c); // keep it until it is typed right once
          }
          ask();
        }, gap);
        root.replaceChildren(
          h('div.hud', h('span', h('b', (doneN + 1) + ' / ' + deck.length)), h('span', '✓ ' + firstRight.size + '  ✗ ' + missed.size)),
          LC.ui.progress(doneN, deck.length), q);
      }
      function end() {
        const score = firstRight.size, total = deck.length;
        ctx.finish({ score, total, wrong: [...missed] });
        const miss = deck.filter((c) => missed.has(c.id));
        root.replaceChildren(LC.ui.end({
          title: LC.t('score', { a: score, b: total }), good: score === total,
          lines: [h('p.big', Math.round((100 * score) / total) + '%'),
            miss.length ? h('ul.cardlist', miss.map((c) => h('li', h('span.lv.lv' + M.get(c.id)), h('span.t', { lang: ctx.termLang, dir: 'auto' }, c.term), h('span.d', { dir: 'auto' }, LC.def(c)), LC.ui.sayBtn(c.term, ctx.termLang)))) : null],

            { label: LC.t('again'), primary: !miss.length, onclick: () => begin(ctx.cards) },
            { label: LC.t('back'), onclick: ctx.exit },

})();

// Bubble pop: a prompt at the top, 4 answer bubbles drift up with a gentle sway at different speeds.
// Pop the right one before it escapes. Wrong pop or escape = lose a heart. 15 prompts; misses come back sooner.
(function () {
  const LC = window.LC;
  const ROUND = 15, HEARTS = 3, BASE_SECS = 9.5;

  LC.modes.bubbles = {
    kind: 'game', min: 4,
    mount(root, ctx) {
      const { h, t } = ctx;
      const SPEED = window.LC_TEST_SPEED || 1; // test hook: headless runs speed the game up
      const ansLang = ctx.promptIsTerm ? null : ctx.termLang;
      const heartsTxt = (n) => '♥'.repeat(n) + '♡'.repeat(HEARTS - n);

      function intro() {
        const best = ctx.best.get('bubbles');
        const go = h('button.btn.primary.big', { type: 'button', onclick: play }, t('g_start'));
        root.replaceChildren(h('section.setup.g-intro', h('p.g-how', t('g_howBubbles')), h('p.kbdhint.g-keys', t('g_keysHint')),
          best != null ? h('p.muted', t('best', { v: best + ' ' + t('points') })) : null, go));
        go.focus();
      }

      function play() {
        let order = [];
        while (order.length < ROUND) { const s = ctx.shuffle(ctx.cards); if (order.length && s[0] === order[order.length - 1]) s.push(s.shift()); order.push(...s); }

        const ptsEl = h('b', '0'), streakEl = h('b', '0'), heartsEl = h('b.g-hearts', heartsTxt(hearts));
        const hud = h('div.hud', h('span', t('points') + ' ', ptsEl), h('span.g-streak', t('g_streakL') + ' ', streakEl), h('span', t('lives') + ' ', heartsEl));
        const prog = h('div.g-progwrap', ctx.ui.progress(0, ROUND));
        const promptEl = h('div.g-prompt', { 'aria-live': 'polite' });
        const sky = h('div.g-sky');
        const note = h('p.g-note', { 'aria-live': 'polite' }, ' ');
        root.replaceChildren(hud, prog, promptEl, sky, note);
        ctx.on(document, 'visibilitychange', () => { paused = document.hidden; });
        ctx.on(document, 'keydown', (e) => {
          if (e.ctrlKey || e.metaKey || e.altKey || !/^[1-4]$/.test(e.key)) return;
          const b = bubs.find((x) => x.lane === Number(e.key) - 1 && !x.gone);

        function next() {

          prog.replaceChildren(ctx.ui.progress(idx, ROUND));
          ctx.where((idx + 1) + '/' + ROUND);
          promptEl.replaceChildren(h('span.g-ptext', { dir: 'auto', lang: ctx.promptIsTerm ? ctx.termLang : null }, ctx.prompt(card)),
            ...(ctx.promptIsTerm && ctx.canSpeak ? [ctx.ui.sayBtn(card.term, ctx.termLang)] : []));
          note.textContent = ' ';
          sky.replaceChildren();
          const opts = ctx.options(card, 4);
          const W = sky.clientWidth || 320, laneW = W / opts.length;
          d = Math.min(140, laneW - 8);
          const pace = Math.max(0.65, 1 - 0.025 * right);
          const rightKey = LC.norm(ctx.answer(card));
          bubs = opts.map((text, lane) => {
            const span = h('span.g-btxt', { dir: 'auto', lang: ansLang }, text);
            const b = { text, lane, ok: LC.norm(text) === rightKey, t: -Math.random() * 0.9 / SPEED,
              dur: (BASE_SECS * pace * (0.85 + Math.random() * 0.4)) / SPEED, ph: Math.random() * 6.28, hz: 0.5 + Math.random() * 0.5 };
            const el = b.el = h('button.g-bub', { type: 'button', 'aria-label': (lane + 1) + ': ' + text, style: { width: d + 'px', height: d + 'px' }, onclick: () => tap(b) },
              h('span.g-key', { 'aria-hidden': 'true' }, String(lane + 1)), span);

            lines: [h('p.big', points + ' ' + t('points')), t('g_rightOf', { a: right, b: asked }),
              rec && points > 0 ? h('p.g-rec', t('newBest')) : t('best', { v: ctx.best.get('bubbles') + ' ' + t('points') })],

})();

// Memory (concentration): face-down grid, each pair = a card's question + its answer on two separate cards.
// Flip two: a pair stays face up, otherwise both flip back after ~900 ms (or sooner on the next tap).
(function () {
  const LC = window.LC;
  const SIZES = [4, 6, 8], FLIP_BACK = 900;

  function pickCards(ctx, n) {
    const seen = new Set(), out = [];
    for (const c of ctx.shuffle(ctx.cards)) {
      const p = 'p' + LC.norm(ctx.prompt(c)), a = 'a' + LC.norm(ctx.answer(c));
      if (p === 'p' || a === 'a' || seen.has(p) || seen.has(a)) continue;
      seen.add(p); seen.add(a); out.push(c);
      if (out.length >= n) break;
    }
    return out;
  }
  const sizeClass = (s) => (s.length > 22 ? '.g-xl' : s.length > 11 ? '.g-l' : '');

  LC.modes.memory = {
    kind: 'game', min: 3,
    mount(root, ctx) {
      const { h, t } = ctx;
      const fmt = (ms) => (ms < 60000 ? t('sec', { n: LC.fmtTime(ms) }) : LC.fmtTime(ms));
      const max = pickCards(ctx, 99).length;
      let sizes = SIZES.filter((n) => n <= max);
      if (!sizes.length) sizes = [max];
      let pairs = LC.store.get('g.memPairs', 6);
      if (!sizes.includes(pairs)) pairs = sizes.includes(6) ? 6 : sizes[sizes.length - 1];

      function intro() {
        const bestEl = h('p.muted');
        const showBest = () => { const b = ctx.best.get('memory' + pairs); bestEl.textContent = b != null ? t('best', { v: b + ' ' + t('moves') }) : ''; bestEl.hidden = b == null; };
        const seg = h('div.seg.g-sizes', { role: 'group', 'aria-label': t('g_pickSize') }, h('span', t('g_pickSize')),
          sizes.map((n) => h('button', {
            type: 'button', 'aria-pressed': String(n === pairs),
            onclick: (e) => {
              pairs = n; LC.store.set('g.memPairs', n);
              seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === e.currentTarget)));
              showBest();
            },
          }, t('g_pairs', { n }))));
        const go = h('button.btn.primary.big', { type: 'button', onclick: play }, t('g_start'));
        root.replaceChildren(h('section.setup.g-intro', h('p.g-how', t('g_howMemory')), seg, bestEl, go));
        showBest(); go.focus();
      }

      function play() {
        const chosen = pickCards(ctx, pairs);
        const total = chosen.length;
        let open = [], lock = false, moves = 0, found = 0, started = 0, done = false, timer = 0;
        const timeEl = h('b', fmt(0)), movesEl = h('b', '0'), foundEl = h('b', '0/' + total);
        const hud = h('div.hud', h('span', t('time') + ' ', timeEl), h('span', t('moves') + ' ', movesEl), h('span', t('g_pairsLeft') + ' ', foundEl));
        const tip = h('p.kbdhint.g-tip', { 'aria-live': 'polite' }, ' ');
        const deck = [];
        chosen.forEach((c) => {
          deck.push({ c, kind: 'q', text: ctx.prompt(c), isTerm: ctx.promptIsTerm });
          deck.push({ c, kind: 'a', text: ctx.answer(c), isTerm: !ctx.promptIsTerm });
        });
        const label = (cd) => t(cd.kind === 'q' ? 'g_kindQ' : 'g_kindA');
        const grid = h('div.g-mgrid' + (deck.length <= 6 ? '.c3' : ''), ctx.shuffle(deck).map((cd, i) => {
          cd.n = i + 1;
          cd.el = h('button.g-card', { type: 'button', 'aria-label': t('g_faceDown', { n: cd.n }), onclick: () => tap(cd) },
            h('span.g-in', { 'aria-hidden': 'true' },
              h('span.g-face.g-back', h('span.g-qm', '?')),
              h('span.g-face.g-front.' + cd.kind + sizeClass(cd.text),
                h('small.g-lab', label(cd)),
                h('span.g-txt', { dir: 'auto', lang: cd.isTerm ? ctx.termLang : null }, cd.text))));
          return cd.el;
        }));
        root.replaceChildren(hud, grid, tip);
        ctx.where('0/' + total);
        ctx.every(() => { if (started && !done) timeEl.textContent = fmt(performance.now() - started); }, 200);

        function show(cd) { cd.open = true; cd.el.classList.add('open'); cd.el.setAttribute('aria-label', label(cd) + ': ' + cd.text); }
        function hide(cd) { cd.open = false; cd.el.classList.remove('open'); cd.el.setAttribute('aria-label', t('g_faceDown', { n: cd.n })); }
        function flipBack() { clearTimeout(timer); open.forEach(hide); open = []; lock = false; tip.textContent = ' '; }

        function tap(cd) {
          if (done || cd.done) return;
          if (lock) { const wasOpen = cd.open; flipBack(); if (wasOpen) return; }
          if (cd.open) return;
          if (!started) started = performance.now();
          show(cd); open.push(cd);
          if (open.length < 2) return;
          moves++; movesEl.textContent = String(moves);
          const [x, y] = open;
          const q = x.kind === 'q' ? x : y, a = q === x ? y : x;
          if (x.c.id === y.c.id) {
            ctx.answered(q.c, true, 'memory', a.text);
            [x, y].forEach((k) => { k.done = true; k.el.classList.add('done'); k.el.setAttribute('aria-disabled', 'true'); });
            open = []; found++;
            foundEl.textContent = found + '/' + total; ctx.where(found + '/' + total);
            if (found === total) { done = true; ctx.later(end, 650); }
          } else {
            if (x.kind !== y.kind) ctx.answered(q.c, false, 'memory', a.text);
            lock = true; tip.textContent = t('g_tapBack');
            timer = ctx.later(flipBack, FLIP_BACK);
          }
        }

        function end() {
          const ms = Math.round(performance.now() - started);
          const key = 'memory' + total;
          const rec = ctx.best.offer(key, moves, true);
          ctx.finish({ score: total, total, moves, ms, pairs: total });
          root.replaceChildren(ctx.ui.end({
            title: t('g_allPairs'), good: true,
            lines: [h('p.big', moves + ' ' + t('moves')), t('time') + ': ' + fmt(ms),
              rec ? h('p.g-rec', t('newBest')) : t('best', { v: ctx.best.get(key) + ' ' + t('moves') })],
            actions: [{ label: t('again'), primary: true, onclick: () => ctx.restart() }, { label: t('back'), onclick: () => ctx.exit() }],
          }));
          const b = root.querySelector('.endcard .btn'); if (b) b.focus();
        }
      }

      intro();
    },
  };
})();

// ---- src/games/rain.js
// Word rain: prompts fall from the top; type the answer + Enter to clear the matching item.
// A landed item costs a life and must be copied once (copy-to-learn) before the rain continues.
(function () {
  const LC = window.LC;
  const LIVES = 3, PER_LEVEL = 5;

  LC.modes.rain = {
    kind: 'game', min: 3,
    mount(root, ctx) {
      const { h, t } = ctx;
      const SPEED = window.LC_TEST_SPEED || 1; // test hook: headless runs speed the game up
      const ansLang = ctx.promptIsTerm ? null : ctx.termLang;
      const hearts = (n) => '♥'.repeat(n) + '♡'.repeat(LIVES - n);

      function intro() {
        const best = ctx.best.get('rain');
        const go = h('button.btn.primary.big', { type: 'button', onclick: play }, t('g_start'));
        root.replaceChildren(h('section.setup.g-intro', h('p.g-how', t('g_howRain')),
          best != null ? h('p.muted', t('best', { v: best + ' ' + t('points') })) : null, go));
        go.focus();
      }

      function play() {
        let lives = LIVES, points = 0, level = 1, correct = 0, missed = 0;
        let items = [], queue = [], state = 'play', copyItem = null, paused = false;
        let clock = 0, nextSpawn = 0.4, last = 0;
        const ptsEl = h('b', '0'), lvlEl = h('b', '1'), livesEl = h('b.g-hearts', { 'aria-label': t('lives') + ' ' + lives }, hearts(lives));
        const hud = h('div.hud', h('span', t('points') + ' ', ptsEl), h('span', t('g_level') + ' ', lvlEl), h('span', t('lives') + ' ', livesEl));
        const say = h('div.g-say', { 'aria-live': 'polite' });
        const over = h('div.g-over', { hidden: true, role: 'alert' });
        const area = h('div.g-rain', say, over);
        const input = h('input', {
          type: 'text', dir: 'auto', lang: ansLang, autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off',
          spellcheck: false, enterkeyhint: 'go', 'aria-label': t('typeIt'), placeholder: t('g_answerHere'),
        });
        const form = h('form.typein.g-type', { onsubmit: (e) => { e.preventDefault(); submit(); } },
          input, h('button.btn.primary', { type: 'submit' }, t('check')));
        root.replaceChildren(hud, area, form);
        input.focus();

        // keep the input above an on-screen keyboard: shrink the play area while the keyboard is up
        const vv = window.visualViewport;
        if (vv) ctx.on(vv, 'resize', () => {
          const kb = window.innerHeight - vv.height > 120;
          area.style.height = kb ? Math.max(140, Math.round(vv.height * 0.4)) + 'px' : '';
          if (kb) form.scrollIntoView({ block: 'end' });
        });
        ctx.on(document, 'visibilitychange', () => { paused = document.hidden; });

        const fallSecs = () => Math.max(6, 18 - 1.7 * (level - 1)) / SPEED; // level 1: 18 s top to bottom
        const maxOn = () => (level >= 3 ? 2 : 1);
        function nextCard() {
          for (let i = 0; i < 6; i++) {
            if (!queue.length) queue = ctx.shuffle(ctx.cards);
            const c = queue.shift();
            if (!items.some((it) => LC.norm(ctx.prompt(it.c)) === LC.norm(ctx.prompt(c)))) return c;
            queue.push(c);
          }
          return null;
        }
        function spawn() {
          const c = nextCard(); if (!c) return;
          const el = h('div.g-drop', { dir: 'auto', lang: ctx.promptIsTerm ? ctx.termLang : null }, ctx.prompt(c));
          area.append(el);
          const W = area.clientWidth || 1, H = area.clientHeight || 1;
          const w = Math.min(96, (el.offsetWidth / W) * 100);
          const x = w / 2 + 2 + Math.random() * Math.max(0, 96 - w);
          const it = { c, el, x, y: -(el.offsetHeight / H) * 100 - 1, v: 100 / fallSecs() };
          el.style.left = x + '%'; el.style.top = it.y + '%';
          items.push(it);
        }
        function remove(it) { items = items.filter((x) => x !== it); }
        function flash(text) { say.textContent = text; say.classList.remove('show'); void say.offsetWidth; say.classList.add('show'); }
        function hud2() { ptsEl.textContent = String(points); lvlEl.textContent = String(level); livesEl.textContent = hearts(lives); livesEl.setAttribute('aria-label', t('lives') + ' ' + lives); }

        ctx.frame((ts) => {
          if (state === 'over') return false;
          const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts;
          if (paused || state !== 'play') return true;
          clock += dt;
          const top = items.reduce((m, it) => Math.min(m, it.y), 999);
          if (items.length < maxOn() && clock >= nextSpawn && (!items.length || top > 45)) spawn();
          const H = area.clientHeight || 1;
          for (const it of items) {
            it.y += it.v * dt;
            it.el.style.top = it.y + '%';
            if (it.y + (it.el.offsetHeight / H) * 100 >= 99) { land(it); break; }
          }
          return true;
        });

        function land(it) {
          lives--; missed++; hud2();
          ctx.answered(it.c, false, 'rain', '');
          it.el.classList.add('landed');
          state = 'copy'; copyItem = it;
          over.replaceChildren(h('b', t('g_landed')), h('span', t('notYet')),
            h('span.ans', { dir: 'auto', lang: ansLang }, ctx.answer(it.c)), h('span', t('g_copyIt')));
          over.hidden = false;
          input.value = ''; input.focus();
        }

        function shake() { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.select(); }

        function submit() {
          const v = input.value;
          if (!v.trim()) return;
          if (state === 'copy') {
            if (!ctx.isRight(v, copyItem.c)) return shake();
            copyItem.el.remove(); remove(copyItem); copyItem = null;
            over.hidden = true; input.value = '';
            if (!lives) return end();
            state = 'play'; nextSpawn = clock + 0.8 / SPEED;
            return;
          }
          if (state !== 'play') return;
          const hits = items.filter((it) => ctx.isRight(v, it.c)).sort((a, b) => b.y - a.y);
          if (!hits.length) {
            const target = items.slice().sort((a, b) => b.y - a.y)[0];
            if (target) ctx.answered(target.c, false, 'rain', v);
            return shake();
          }
          const it = hits[0];
          ctx.answered(it.c, true, 'rain', v);
          remove(it); it.el.classList.add('hit'); ctx.later(() => it.el.remove(), 320);
          correct++; points += 10 * level;
          input.value = '';
          if (correct % PER_LEVEL === 0) { level++; flash(t('g_levelUp', { n: level })); } else flash(LC.pick(t('praise')));
          if (!items.length) nextSpawn = clock + 0.5 / SPEED;
          hud2(); ctx.where(t('g_level') + ' ' + level + ' · ' + points);
        }

        function end() {
          state = 'over';
          const rec = ctx.best.offer('rain', points, false);
          ctx.finish({ score: correct, total: correct + missed, points, level });
          root.replaceChildren(ctx.ui.end({
            title: t('g_gameOver'), good: rec && points > 0,
            lines: [h('p.big', points + ' ' + t('points')), t('g_right', { n: correct }) + ' · ' + t('g_level') + ' ' + level,
              rec && points > 0 ? h('p.g-rec', t('newBest')) : t('best', { v: ctx.best.get('rain') + ' ' + t('points') })],
            actions: [{ label: t('again'), primary: true, onclick: () => ctx.restart() }, { label: t('back'), onclick: () => ctx.exit() }],
          }));
          const b = root.querySelector('.endcard .btn'); if (b) b.focus();
        }
      }

      intro();
    },
  };
})();
